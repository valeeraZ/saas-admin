apiVersion: v1
kind: Pod
metadata:
  name: {{ .Values.namePrefix }}-smoke
  labels: {app.kubernetes.io/name: {{ .Values.namePrefix }}-smoke}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets: {{ toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsUser: 10001
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: readiness
      image: {{ include "saas.image" (index .Values.workloads "admin-api").image | quote }}
      command: [node, --input-type=module, -e]
      args:
        - |
          const urls = [
            "https://{{ .Values.namePrefix }}-admin-api.{{ .Release.Namespace }}.svc.cluster.local/health/ready",
            "http://{{ .Values.namePrefix }}-portal:3000/api/health/ready",
            "http://{{ .Values.namePrefix }}-console:3000/api/health/ready",
          ];
          for (const url of urls) {
            const response = await fetch(url, {signal: AbortSignal.timeout(10000)});
            if (response.status !== 200) throw new Error("Service readiness failed");
          }
          console.log("PASS platform readiness endpoints");
      env: [{name: NODE_EXTRA_CA_CERTS, value: /run/trust/ca.crt}]
      securityContext: {{ include "saas.security" . | nindent 8 }}
      resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {memory: 128Mi}}
      volumeMounts: [{name: trust, mountPath: /run/trust, readOnly: true}]
  volumes:
    - name: trust
      secret: {secretName: {{ .Values.trustSecret }}}
