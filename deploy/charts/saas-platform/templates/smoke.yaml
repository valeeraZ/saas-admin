apiVersion: v1
kind: Pod
metadata:
  name: {{ .Values.namePrefix }}-smoke
  labels: {app.kubernetes.io/name: {{ .Values.namePrefix }}-smoke}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets: {{ toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsUser: 10001
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: readiness
      image: {{ include "saas.image" .Values.workloads.auth.image | quote }}
      command: [python, -c]
      args:
        - |
          import urllib.request
          urls = [
            "https://{{ .Values.namePrefix }}-auth.{{ .Release.Namespace }}.svc.cluster.local/health/ready",
            "https://{{ .Values.namePrefix }}-admin-api.{{ .Release.Namespace }}.svc.cluster.local/health/ready",
            "http://{{ .Values.namePrefix }}-portal:3000/api/health/ready",
            "http://{{ .Values.namePrefix }}-console:3000/api/health/ready",
          ]
          for url in urls:
              with urllib.request.urlopen(url, timeout=10) as response:
                  assert response.status == 200
          print("PASS all four service readiness endpoints, including verified internal TLS")
      env: [{name: SSL_CERT_FILE, value: /run/trust/ca-bundle.crt}]
      securityContext: {{ include "saas.security" . | nindent 8 }}
      resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {memory: 128Mi}}
      volumeMounts: [{name: trust, mountPath: /run/trust, readOnly: true}]
  volumes:
    - name: trust
      secret: {secretName: {{ .Values.trustSecret }}}
