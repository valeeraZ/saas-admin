name: Validate Admin catalog
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run contracts && git diff --exit-code -- contracts
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run build --prefix web
      - run: docker build -t saas-admin:check .
      - run: docker build -f web/Dockerfile -t saas-console:check .
  deployment-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.16.2
      - run: python -m pip install cryptography==50.0.1 PyYAML==6.0.3
      - run: python -m unittest discover -s deploy/tests -v
