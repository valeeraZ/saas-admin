<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="publish-workflow-zh-CN-title publish-workflow-zh-CN-desc" id="publish-workflow-zh-CN-root"><title id="publish-workflow-zh-CN-title">从应用注册到发布</title><desc id="publish-workflow-zh-CN-desc">管理员注册应用和部署、验证部署后发布；员工角色在 Auth 中单独授予。</desc><defs>
      <style>#publish-workflow-zh-CN-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #publish-workflow-zh-CN-root { font-family: var(--font-sans); color: var(--color-ink); }
      #publish-workflow-zh-CN-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#publish-workflow-zh-CN-root .diagram-container { overflow-x: visible; }
}</style><marker id="publish-workflow-zh-CN-publish-workflow-zh-CN-api" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2e5aa8"/></marker><marker id="publish-workflow-zh-CN-publish-workflow-zh-CN-local" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/></marker><marker id="publish-workflow-zh-CN-publish-workflow-zh-CN-focus" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#bf4520"/></marker></defs><rect x="0" y="0" width="960" height="600" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1.4"/><text x="40" y="52" fill="#2d3142" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="600" text-anchor="start">从应用注册到发布</text><path d="M160 208 H340" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#publish-workflow-zh-CN-publish-workflow-zh-CN-local)"/><path d="M388 208 H568" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#publish-workflow-zh-CN-publish-workflow-zh-CN-local)"/><path d="M616 208 H796" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#publish-workflow-zh-CN-publish-workflow-zh-CN-local)"/><rect x="112" y="184" width="48" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.4"/><text x="136" y="214" fill="#4f5d75" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">01</text><text x="136" y="278" fill="#2d3142" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" text-anchor="middle">注册应用</text><text x="136" y="318" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">分配应用 UUID</text><text x="136" y="342" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">和挂载路径</text><rect x="340" y="184" width="48" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.4"/><text x="364" y="214" fill="#4f5d75" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">02</text><text x="364" y="278" fill="#2d3142" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" text-anchor="middle">登记部署</text><text x="364" y="318" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">记录源站和制品摘要</text><text x="364" y="342" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">初始状态为待审核</text><rect x="568" y="184" width="48" height="48" rx="6" fill="#fff0e7" stroke="#bf4520" stroke-width="1.4"/><text x="592" y="214" fill="#bf4520" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">03</text><text x="592" y="278" fill="#2d3142" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" text-anchor="middle">审核部署</text><text x="592" y="318" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">在平台外验证部署</text><text x="592" y="342" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">将状态设为就绪</text><rect x="796" y="184" width="48" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.4"/><text x="820" y="214" fill="#4f5d75" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">04</text><text x="820" y="278" fill="#2d3142" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" text-anchor="middle">在 Admin 发布</text><text x="820" y="318" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">启用并赋予平台资格</text><text x="820" y="342" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">设置有效期</text><rect x="156" y="396" width="648" height="72" rx="6" fill="#e5effb" stroke="#355b89" stroke-width="1.4"/><text x="480" y="426" fill="#2d3142" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" text-anchor="middle">在 SaaS Auth 中为员工配置访问权限</text><text x="480" y="450" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">定义应用角色，再直接授权或审批访问申请。</text><path d="M40 532 H920" fill="none" stroke="#bfc0c0" stroke-width="1.6"/><text x="56" y="565" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" text-anchor="start">控制台与 CLI 使用同一套目录写入操作。</text></svg>
