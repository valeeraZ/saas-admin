<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="publish-workflow-en-title publish-workflow-en-desc" id="publish-workflow-en-root"><title id="publish-workflow-en-title">From app registration to publication</title><desc id="publish-workflow-en-desc">An operator registers the app and deployment, verifies the deployment, and publishes it; employee roles are granted separately in Auth.</desc><defs>
      <style>#publish-workflow-en-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #publish-workflow-en-root { font-family: var(--font-sans); color: var(--color-ink); }
      #publish-workflow-en-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#publish-workflow-en-root .diagram-container { overflow-x: visible; }
}</style><marker id="publish-workflow-en-publish-workflow-en-api" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2e5aa8"/></marker><marker id="publish-workflow-en-publish-workflow-en-local" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/></marker><marker id="publish-workflow-en-publish-workflow-en-focus" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#bf4520"/></marker></defs><rect x="0" y="0" width="960" height="600" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1.4"/><text x="40" y="52" fill="#2d3142" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="600" text-anchor="start">From app registration to publication</text><path d="M160 208 H340" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#publish-workflow-en-publish-workflow-en-local)"/><path d="M388 208 H568" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#publish-workflow-en-publish-workflow-en-local)"/><path d="M616 208 H796" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#publish-workflow-en-publish-workflow-en-local)"/><rect x="112" y="184" width="48" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.4"/><text x="136" y="214" fill="#4f5d75" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">01</text><text x="136" y="278" fill="#2d3142" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Register the app</text><text x="136" y="318" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Assign its UUID</text><text x="136" y="342" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">and mount path</text><rect x="340" y="184" width="48" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.4"/><text x="364" y="214" fill="#4f5d75" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">02</text><text x="364" y="278" fill="#2d3142" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Register the build</text><text x="364" y="318" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Record origin and digest</text><text x="364" y="342" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Runtime starts pending</text><rect x="568" y="184" width="48" height="48" rx="6" fill="#fff0e7" stroke="#bf4520" stroke-width="1.4"/><text x="592" y="214" fill="#bf4520" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">03</text><text x="592" y="278" fill="#2d3142" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Approve the build</text><text x="592" y="318" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Verify it externally</text><text x="592" y="342" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Mark it ready</text><rect x="796" y="184" width="48" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.4"/><text x="820" y="214" fill="#4f5d75" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">04</text><text x="820" y="278" fill="#2d3142" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Publish in Admin</text><text x="820" y="318" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Enable availability</text><text x="820" y="342" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Set an expiry</text><rect x="156" y="396" width="648" height="72" rx="6" fill="#e5effb" stroke="#355b89" stroke-width="1.4"/><text x="480" y="426" fill="#2d3142" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Set employee access in SaaS Auth</text><text x="480" y="450" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Define app roles, then grant them directly or approve a request.</text><path d="M40 532 H920" fill="none" stroke="#bfc0c0" stroke-width="1.6"/><text x="56" y="565" fill="#4f5d75" font-family="Geist, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" text-anchor="start">The operator console and CLI use the same catalog write operations.</text></svg>
